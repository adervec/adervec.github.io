<!doctype html><meta charset="utf-8"><title>font.js self-test</title><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-name" content="Selftest">
<meta name="app-whatsnew" content="data:application/json,%5B%7B%22date%22%3A%222026-11-10%22%2C%22items%22%3A%5B%22Second%20thing%22%5D%7D%2C%7B%22date%22%3A%222026-11-01%22%2C%22items%22%3A%5B%22First%20thing%22%5D%7D%5D">
<style>body { font-family: var(--app-font, serif); }</style>
<script>localStorage.removeItem('maker-font'); localStorage.removeItem('maker-seen:font-selftest.html'); localStorage.removeItem('maker-whatsnew-off');</script>
<script src="font.js"></script>
<app-font-picker></app-font-picker><pre id="log">running…</pre>
<script>
(async function () {
  var fails = [], ok = function (name, cond) { if (!cond) fails.push(name); };
  var fam = function () { return getComputedStyle(document.body).fontFamily; };
  ok('default is atkinson', appFont.get() === 'atkinson' && /Atkinson Hyperlegible/.test(fam()));
  var sel = document.querySelector('app-font-picker select');
  ok('picker lists every option', sel && sel.options.length === appFont.options.length);
  sel.value = 'serif'; sel.dispatchEvent(new Event('change'));
  ok('picker changes the body font', /^Georgia/.test(fam()) && appFont.get() === 'serif');
  ok('choice is stored', localStorage.getItem('maker-font') === 'serif');
  appFont.set('nonsense');
  ok('unknown id falls back to the default', appFont.get() === 'atkinson' && sel.value === 'atkinson');
  await document.fonts.load('16px "Atkinson Hyperlegible"');
  ok('the font file actually loads', document.fonts.check('16px "Atkinson Hyperlegible"'));
  var info = document.querySelector('app-font-picker app-build-info');
  ok('the build stamp shows under the picker', info && /^Build .*\d{4}/.test(info.textContent));
  appFont.updateNotice(); appFont.updateNotice();
  var bars = document.querySelectorAll('#app-update-notice');
  ok('the update notice shows once, with a Reload button', bars.length === 1 && /Reload/.test(bars[0].textContent));
  bars[0].querySelectorAll('button')[1].click();
  ok('Later dismisses the notice', !document.getElementById('app-update-notice'));
  var vp = function () { return (document.querySelector('meta[name="viewport"]') || {}).content || ''; };
  ok('pinch-zoom is off by default', /user-scalable=no/.test(vp()) && !appFont.zoomAllowed());
  var zc = document.querySelector('app-font-picker input[type=checkbox]');
  ok('the picker offers the zoom option', !!zc && !zc.checked);
  zc.click();
  ok('turning it on lifts the zoom limit', appFont.zoomAllowed() && !/user-scalable|maximum-scale/.test(vp()) && /width=device-width/.test(vp()));
  zc.click();
  ok('turning it off restores it, with one viewport tag', /user-scalable=no/.test(vp()) && document.querySelectorAll('meta[name="viewport"]').length === 1);
  setTimeout(function () { throw new Error('ResizeObserver loop completed with undelivered notifications.'); }, 0);
  await new Promise(function (r) { setTimeout(r, 30); });
  ok('benign browser noise is not treated as a crash', !document.getElementById('app-crash-notice'));
  setTimeout(function () { throw new Error('boom: selftest'); }, 0);
  await new Promise(function (r) { setTimeout(r, 30); });
  var crash = document.getElementById('app-crash-notice');
  ok('an uncaught error shows the crash notice with Reload', crash && /Reload/.test(crash.textContent) && /boom: selftest/.test(crash.querySelector('pre').textContent));
  Promise.reject(new Error('second'));
  await new Promise(function (r) { setTimeout(r, 30); });
  ok('the crash notice shows once', document.querySelectorAll('#app-crash-notice').length === 1);
  crash.remove();
  localStorage.removeItem('maker-zoom');
  var key = Object.keys(localStorage).filter(function (k) { return k.indexOf('maker-seen:') === 0; })[0];
  await appFont.checkWhatsNew();
  ok("a first visit records what's new silently", !document.getElementById('app-whatsnew') && !!localStorage.getItem(key || 'maker-seen:font-selftest.html'));
  key = Object.keys(localStorage).filter(function (k) { return k.indexOf('maker-seen:') === 0; })[0];
  localStorage.setItem(key, 'older|2026-10-01|Old');
  await appFont.checkWhatsNew();
  var wn = document.getElementById('app-whatsnew');
  ok("after an update, what's new shows the new entries", wn && /Second thing/.test(wn.textContent) && /First thing/.test(wn.textContent) && /Selftest/.test(wn.textContent));
  wn.querySelector('button').click(); // "Don't show these"
  localStorage.setItem(key, 'older|2026-10-01|Old');
  await appFont.checkWhatsNew();
  ok("silencing stops the card", !document.getElementById('app-whatsnew') && localStorage.getItem('maker-whatsnew-off') === '1');
  appFont.setWhatsNewSilenced(false);
  var about = document.querySelector('app-font-picker app-about details');
  ok('the picker carries an About panel', !!about && /About Selftest/.test(about.querySelector('summary').textContent));
  about.open = true; about.dispatchEvent(new Event('toggle'));
  await new Promise(function (r) { setTimeout(r, 200); });
  ok("About shows version, licence, data, storage and what's new", /Version:/.test(about.textContent) && /Licence: MIT/.test(about.textContent) && /Your data:/.test(about.textContent) && /Storage: .*(MB|GB|browser)/.test(about.textContent) && /Second thing/.test(about.textContent));
  var diag = await appFont.diagnostics();
  ok('diagnostics carry build, browser, storage and the last errors', /Build:/.test(diag) && /Browser:/.test(diag) && /Storage:/.test(diag) && /boom: selftest/.test(diag));
  ok('systemTheme reports light or dark', /^(light|dark)$/.test(appFont.systemTheme()));
  localStorage.removeItem(key);
  var src = await (await fetch('font.js')).text();
  ok('font.js can be inlined verbatim (no closing script tag inside)', !/<\/script/i.test(src));
  localStorage.removeItem('maker-font');
  document.getElementById('log').textContent = fails.length ? 'FAILED:\n' + fails.join('\n') : 'SELFTEST PASS';
})();
</script>
